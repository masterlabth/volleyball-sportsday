async function login(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

const userRef =
doc(db,"users",username);

const userSnap =
await getDoc(userRef);

if(!userSnap.exists()){

loginMsg.innerText =
"ไม่พบผู้ใช้";

return;

}

const userData =
userSnap.data();

if(userData.password !== password){

"รหัสผ่านไม่ถูกต้อง";

return;

}

currentUser = userData;

welcome.innerText =

async function loadMatches(){

const snapshot =
await getDocs(
collection(db,"matches")
);

const matches=[];

snapshot.forEach(docSnap=>{

matches.push({
id:docSnap.id,
...docSnap.data()
});

});

matches.sort((a,b)=>{

const noA =
parseInt(
a.id.replace("match","")
);

const noB =
parseInt(
b.id.replace("match","")
);

return noA-noB;

});
