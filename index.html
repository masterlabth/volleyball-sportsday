<style>
*{

</head>
<body>

<h1>🏐 วอลเลย์บอลกีฬาสี 2569</h1>

<div id="loginBox" class="card">

<h2>เข้าสู่ระบบ</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button
class="primary"
id="loginBtn">
เข้าสู่ระบบ
</button>

<p id="loginMsg"></p>

</div>

<div id="app" class="hidden">

<div class="card">

<h2 id="welcome"></h2>

<button
class="danger"
id="logoutBtn">
ออกจากระบบ
</button>

<button
class="primary"
id="createMatchesBtn">
สร้างข้อมูลการแข่งขัน
</button>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
getFirestore,
collection,
doc,
getDoc,
getDocs,
setDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAvnmm8_BgU0tsua-D85GrISvAygObxgho",
authDomain: "volleyball-sportsday.firebaseapp.com",
projectId: "volleyball-sportsday",
storageBucket: "volleyball-sportsday.firebasestorage.app",
messagingSenderId: "607664964432",
appId: "1:607664964432:web:dc4a1cedbfabf185376255"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;

const loginBox = document.getElementById("loginBox");
const appBox = document.getElementById("app");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginMsg = document.getElementById("loginMsg");
const welcome = document.getElementById("welcome");
const matchesContainer = document.getElementById("matchesContainer");

loginBtn.addEventListener("click", login);

logoutBtn.addEventListener("click", ()=>{

currentUser=null;

loginBox.classList.remove("hidden");
appBox.classList.add("hidden");

});

async function login(){

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value.trim();

const userRef =
doc(db,"users",username);

const userSnap =
await getDoc(userRef);

if(!userSnap.exists()){

loginMsg.innerText="ไม่พบผู้ใช้";
return;

}

const userData=userSnap.data();

if(userData.password!==password){

loginMsg.innerText="รหัสผ่านไม่ถูกต้อง";
return;

}

currentUser=userData;

welcome.innerText=
`ยินดีต้อนรับ ${userData.username}`;

loginBox.classList.add("hidden");
appBox.classList.remove("hidden");

loadMatches();

}

function teamClass(name){

if(name.includes("เหลือง"))
return "team-yellow";

if(name.includes("ชมพู"))
return "team-pink";

if(name.includes("แดง"))
return "team-red";

if(name.includes("น้ำเงิน"))
return "team-blue";

return "";

}

async function loadMatches(){

matchesContainer.innerHTML="";

const snapshot =
await getDocs(
collection(db,"matches")
);

const matches=[];

snapshot.forEach(docSnap=>{

matches.push({

id:docSnap.id,
...docSnap.data()

});

});

matches.sort((a,b)=>{

const noA=
parseInt(
a.id.replace("match","")
);

const noB=
parseInt(
b.id.replace("match","")
);

return noA-noB;

});

for(const match of matches){

const div =
document.createElement("div");

div.className="card";

div.innerHTML=`

<div class="match">

<h3>
${match.id}
</h3>

<p>
${match.category}
|
${match.round}
</p>

<p>

<span class="${teamClass(match.teamA)}">
${match.teamA}
</span>

VS

<span class="${teamClass(match.teamB)}">
${match.teamB}
</span>

</p>

<p>
ผู้ชนะ :
<b>${match.winner || "-"}</b>
</p>

<div class="score-row">

<input
type="number"
id="${match.id}_set1A"

class="primary"
onclick="saveMatch('${match.id}')">

`;

matchesContainer.appendChild(div);

}
 window.saveMatch = async function(matchId){

const set1A =
parseInt(
document.getElementById(`${matchId}_set1A`).value
) || 0;

const set1B =
parseInt(
document.getElementById(`${matchId}_set1B`).value
) || 0;

const set2A =
parseInt(
document.getElementById(`${matchId}_set2A`).value
) || 0;

const set2B =
parseInt(
document.getElementById(`${matchId}_set2B`).value
) || 0;

const set3A =
parseInt(
document.getElementById(`${matchId}_set3A`).value
) || 0;

const set3B =
parseInt(
document.getElementById(`${matchId}_set3B`).value
) || 0;

const matchRef =
doc(db,"matches",matchId);

const matchSnap =
await getDoc(matchRef);

if(!matchSnap.exists()){
alert("ไม่พบข้อมูลการแข่งขัน");
return;
}

const matchData =
matchSnap.data();

let winA = 0;
let winB = 0;

if(set1A > set1B) winA++;
if(set1B > set1A) winB++;

if(set2A > set2B) winA++;
if(set2B > set2A) winB++;

if(set3A > set3B) winA++;
if(set3B > set3A) winB++;

let winner = "";
let status = "pending";

if(winA >= 2){

winner = matchData.teamA;
status = "completed";

}

if(winB >= 2){

winner = matchData.teamB;
status = "completed";

}

await updateDoc(matchRef,{

set1A,
set1B,

set2A,
set2B,

set3A,
set3B,

winner,
status

});

alert("บันทึกคะแนนเรียบร้อย");

loadMatches();

};
